<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>전체 이용 강아지 목록 - 강아지여행.com</title>
  <link rel="stylesheet" href="/css/adminall-list.css">
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <!-- 세션 로그인 -->
  <script src="/js/admin-auth.js"></script>

  <header>
    <h1>📋 전체 이용 강아지 목록</h1>
    <a href="adminbooking.html" class="back-btn">← 관리자 메인으로</a>
  </header>

  <main class="all-list-main">
    <div class="search-container">
      <input type="text" id="searchInput" placeholder="강아지 이름 또는 견주 이름 검색..." class="search-input">
    </div>

    <div class="sort-buttons">
      <button onclick="sortList('dogName')" class="sort-btn">🐶 강아지이름순</button>
      <button onclick="sortList('ownerName')" class="sort-btn">👤 견주이름순</button>
    </div>

    <div id="allList" class="dogs-list"></div>
  </main>

  <script src="/js/firebase-config.js"></script>
  <script src="/js/adminall-list.js"></script>
</body>
</html>
