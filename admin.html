<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 페이지 - 강아지여행.com</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/admin.css">
  
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>
  <header>
    <h1>🔧 관리자 페이지</h1>
    <a href="/album.html" style="position:absolute; right:40px; top:35px; color:#2c2218; font-size:1.1rem;">← 앨범으로 돌아가기</a>
  </header>

  <div class="admin-container">
    <div class="section">
      <h3>🐾 새로운 강아지 앨범(폴더) 생성</h3>
      <div class="form-grid">
        <input type="text" id="dogName" placeholder="강아지 이름 *" class="admin-input">
        <input type="text" id="ownerName" placeholder="견주 이름 *" class="admin-input">
        <input type="text" id="phoneLast4" placeholder="핸드폰 번호 뒷자리 4자리" maxlength="4" class="admin-input">
        <input type="text" id="passwordInput" placeholder="비밀번호 (빈칸 = 공개 앨범)" class="admin-input">
      </div>
      <button onclick="createNewDogAlbum()" class="photo-btn" style="width:100%; margin-top:25px; padding:16px; font-size:1.2rem;">
        ✅ 앨범 폴더 생성하기
      </button>
    </div>

    <hr>

    <div class="section">
      <h3>📋 등록된 강아지 목록</h3>
      <div id="dogsList" class="dogs-list"></div>
    </div>
  </div>

  <script src="/js/firebase-config.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
